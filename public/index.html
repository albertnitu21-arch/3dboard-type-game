<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gurtpoly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="home" class="screen">
      <h1>GURTPOLY</h1>
      <p class="sub">Un joc de lăcomie și invidie pentru 2–8 jucători.</p>
      <div id="resume" class="resume" hidden>
        <span class="grow">You still have a seat in room <b id="resume-code"></b>.</span>
        <button id="resume-go" class="small primary" type="button">Rejoin</button>
        <button id="resume-forget" class="small ghost" type="button" title="Give up that seat (a bot takes over)">Leave it</button>
      </div>
      <label>Your name <input id="name" maxlength="20" autocomplete="nickname" placeholder="e.g. Ana"></label>
      <button id="create" class="primary">Create a room</button>
      <div class="or">or join one</div>
      <div class="row">
        <input id="code" maxlength="4" placeholder="CODE" autocapitalize="characters" spellcheck="false">
        <button id="join">Join</button>
      </div>
      <p id="home-error" class="error" role="alert"></p>
    </section>

    <section id="lobby" class="screen" hidden>
      <h2>Room <span id="room-code" class="code"></span></h2>
      <p class="sub">Share this link: <a id="share" href="#"></a> <button id="copy" class="small">Copy</button></p>
      <ul id="members" class="members"></ul>
      <h3 class="pick-title">Choose your piece</h3>
      <div id="piece-picker" class="piece-picker" role="radiogroup" aria-label="Choose your piece"></div>
      <div id="host-controls" class="row">
        <button id="add-bot">Add bot</button>
        <button id="start" class="primary">Start game</button>
      </div>
      <p id="lobby-wait" class="sub">Waiting for the host to start…</p>
      <button id="leave-lobby" class="small ghost">Leave room</button>
      <p id="lobby-error" class="error" role="alert"></p>
    </section>

    <section id="game" class="screen" hidden>
      <div class="board-wrap">
        <div id="board3d" class="board3d">
          <canvas id="board-canvas" aria-label="3D game board. Drag to rotate, scroll or pinch to zoom, tap a space for details."></canvas>
        </div>
        <div id="board" class="board" aria-label="Game board" hidden></div>
        <!-- one button opens the view menu: camera, scene and screen options -->
        <button id="view-btn" class="view-fab" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="view-menu" title="Camera, scene and screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
          <span>View</span>
        </button>
        <!-- your moves (roll, buy, end turn...) float over the board -->
        <div id="dock" class="dock" hidden>
          <div id="dock-status" class="dock-status"></div>
          <div class="dock-row">
            <div id="actions" class="actions"></div>
            <div id="dock-opts" class="dock-opts"></div>
          </div>
          <p id="dock-error" class="dock-error" role="alert" hidden></p>
        </div>
      </div>
      <aside class="side">
        <button id="panel-hide" class="panel-hide" type="button" title="Hide this panel" aria-label="Hide the side panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div id="away-bar" class="away-bar" hidden></div>
        <div id="status" class="status"></div>
        <p id="game-error" class="error" role="alert"></p>
        <div id="space-info" class="space-info" hidden></div>
        <ul id="players" class="players"></ul>
        <details id="manage" open>
          <summary>My properties</summary>
          <div id="mine"></div>
        </details>
        <div id="trade-banner" class="trade-banner" hidden></div>
        <ol id="log" class="log"></ol>
        <form id="chat-form" class="row">
          <input id="chat-input" maxlength="200" placeholder="Say something…" autocomplete="off">
          <button>Send</button>
        </form>
      </aside>
      <button id="panel-show" class="panel-show" type="button" title="Show the side panel" aria-label="Show the side panel" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        <span>Players</span>
      </button>
      <div class="game-menu">
        <button id="leave-game" class="small ghost" type="button">Leave game</button>
        <button id="restart-game" class="small ghost" type="button" hidden>Back to lobby</button>
      </div>
    </section>
  </main>
  <div id="view-backdrop" class="view-backdrop" hidden></div>
  <div id="view-menu" class="view-menu" role="dialog" aria-modal="false" aria-labelledby="vm-title" hidden></div>
  <div id="trade-modal" class="overlay" hidden></div>
  <div id="raise-modal" class="overlay" hidden></div>
  <div id="card-popup" class="overlay card-overlay" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
