# Render Blueprint: Render reads this file and creates the service for you.
# Dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: estate-game
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
